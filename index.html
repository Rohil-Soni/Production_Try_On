<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>The Eye Wear Try-On</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #renderer-container { width: 100%; height: 100%; display: block; }
    .xr-loading, .xr-error, .xr-almost-there {
      font-family: system-ui, sans-serif !important;
    }
  </style>
  <style>
    /* Pre-declare the font locally so the browser uses our copy instead of
       fetching 8th Wall's CDN font (suppresses font 404/network errors) */
    @font-face {
      font-family: 'Nunito-SemiBold';
      src: url('/fonts/Nunito-SemiBold.woff') format('woff');
      font-weight: 400;
      font-style: normal;
    }
  </style>
  <!-- XR Extras script removed: cdn.8thwall.com/web/xrextras/xrextras.js is the retired
       hosted-era CDN (returns HTML instead of JS). The AR pipeline runs without it. -->
</head>
<body>
  <div id="renderer-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
